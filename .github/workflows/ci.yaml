name: CI

on: [push, pull_request]

jobs:
  cpp:
    # Endpoint testing: the oldest and newest CUDA toolkit that can build the
    # C++/CUDA core (the 12.4 toolkit is not published for ubuntu-24.04; 12.6
    # is the oldest available series). Runners have no GPU, so device tests
    # skip and the jobs verify compilation and host paths.
    # Ubuntu is pinned because ubuntu-latest flips to Ubuntu 26 on 2026-10-19
    # and the NVIDIA apt repo is distro-specific.
    # Versions are pinned to major.minor; apt resolves patches on its own.
    name: cpp (${{ matrix.name }})
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: cuda 12.6
            cuda: 12.6
            arch: 80;86
            cc: gcc-12
            cxx: g++-12
          - name: cuda 13.4
            cuda: 13.4
            arch: 80;90;120
            cc: ""
            cxx: ""
    steps:
      - uses: actions/checkout@v6

      - name: Install host compiler
        if: matrix.cxx != ''
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-12 g++-12

      # Install straight from the NVIDIA network repo like
      # Jimver/cuda-toolkit does: the action's strict-semver parser rejects
      # major.minor pins and its version table does not know 13.4 yet.
      - name: Install CUDA
        env:
          CUDA: ${{ matrix.cuda }}
        run: |
          repo=https://developer.download.nvidia.com/compute/cuda/repos/ubuntu2404/x86_64
          wget -q "${repo}/cuda-keyring_1.1-1_all.deb" -O /tmp/cuda-keyring.deb
          sudo dpkg -i /tmp/cuda-keyring.deb
          wget -q "${repo}/cuda-ubuntu2404.pin" -O /tmp/cuda-pin
          sudo mv /tmp/cuda-pin /etc/apt/preferences.d/cuda-repository-pin-600
          sudo add-apt-repository "deb ${repo}/ /"
          sudo apt-get update
          sudo apt-get install -y "cuda-nvcc-$(echo "$CUDA" | tr . -)"
          echo "CUDA_PATH=/usr/local/cuda-${CUDA}" >> "$GITHUB_ENV"
          echo "/usr/local/cuda-${CUDA}/bin" >> "$GITHUB_PATH"
          echo "LD_LIBRARY_PATH=/usr/local/cuda-${CUDA}/lib64${LD_LIBRARY_PATH:+:$LD_LIBRARY_PATH}" >> "$GITHUB_ENV"

      - name: Configure CMake
        env:
          CC: ${{ matrix.cc }}
          CXX: ${{ matrix.cxx }}
          CUDAHOSTCXX: ${{ matrix.cxx }}
        run: |
          cmake -B build -DCMAKE_BUILD_TYPE=Debug -DBUILD_BENCH=ON \
            -DCMAKE_CUDA_ARCHITECTURES="${{ matrix.arch }}"

      - name: Build
        env:
          CC: ${{ matrix.cc }}
          CXX: ${{ matrix.cxx }}
          CUDAHOSTCXX: ${{ matrix.cxx }}
        run: |
          cmake --build build -j

      - name: Test
        run: |
          ctest --test-dir build --output-on-failure

  python:
    # Endpoint testing on the oldest and newest supported Python/torch pairs.
    # Versions are pinned to major.minor and patches resolve on their own. The
    # toolkit follows the cuda pin; a minor mismatch against the torch wheel's
    # bundled CUDA (2.6 ships cu126, 2.13 ships cu131) is only a warning in
    # torch.utils.cpp_extension. Runners have no GPU, so the JIT extension
    # compiles against TORCH_CUDA_ARCH_LIST=8.0 and CUDA tests skip.
    name: python (${{ matrix.name }})
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: 3.10 + torch 2.6
            python: '3.10'
            torch: torch==2.6.*
            index: --index-url https://download.pytorch.org/whl/cu126
            cuda: 12.6
            cc: gcc-12
            cxx: g++-12
          - name: 3.13 + torch 2.13
            python: '3.13'
            torch: torch==2.13.*
            index: ''
            cuda: 13.4
            cc: ''
            cxx: ''
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}

      - name: Install host compiler
        if: matrix.cxx != ''
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-12 g++-12

      # Same direct NVIDIA repo install as the cpp job; see the comment there
      # for why this does not use Jimver/cuda-toolkit.
      - name: Install CUDA
        env:
          CUDA: ${{ matrix.cuda }}
        run: |
          repo=https://developer.download.nvidia.com/compute/cuda/repos/ubuntu2404/x86_64
          wget -q "${repo}/cuda-keyring_1.1-1_all.deb" -O /tmp/cuda-keyring.deb
          sudo dpkg -i /tmp/cuda-keyring.deb
          wget -q "${repo}/cuda-ubuntu2404.pin" -O /tmp/cuda-pin
          sudo mv /tmp/cuda-pin /etc/apt/preferences.d/cuda-repository-pin-600
          sudo add-apt-repository "deb ${repo}/ /"
          sudo apt-get update
          sudo apt-get install -y "cuda-nvcc-$(echo "$CUDA" | tr . -)"
          echo "CUDA_PATH=/usr/local/cuda-${CUDA}" >> "$GITHUB_ENV"
          echo "/usr/local/cuda-${CUDA}/bin" >> "$GITHUB_PATH"
          echo "LD_LIBRARY_PATH=/usr/local/cuda-${CUDA}/lib64${LD_LIBRARY_PATH:+:$LD_LIBRARY_PATH}" >> "$GITHUB_ENV"

      # An empty CC/CXX/CUDAHOSTCXX export makes torch emit a bare -ccbin that
      # breaks nvcc, so only export the vars when the matrix pins a compiler.
      - name: Select host compiler
        if: matrix.cxx != ''
        run: |
          echo "CC=${{ matrix.cc }}" >> "$GITHUB_ENV"
          echo "CXX=${{ matrix.cxx }}" >> "$GITHUB_ENV"
          echo "CUDAHOSTCXX=${{ matrix.cxx }}" >> "$GITHUB_ENV"

      - name: Cache pip
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: pip-${{ matrix.python }}-${{ matrix.torch }}

      - name: Cache JIT extensions
        uses: actions/cache@v4
        with:
          path: ~/.cache/fss_crypto
          key: jit-${{ matrix.python }}-${{ matrix.torch }}-${{ matrix.cuda }}-${{ hashFiles('fss_crypto/**', 'include/fss/**') }}

      - name: Install
        run: |
          pip install --upgrade pip setuptools wheel
          pip install ${{ matrix.torch }} ${{ matrix.index }}
          pip install --no-build-isolation -e '.[dev]'

      - name: Test
        run: |
          python -m pytest test/ -q

  doc:
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@v6

      - name: Install Doxygen
        run: |
          sudo apt-get update
          sudo apt-get install -y doxygen graphviz

      - name: Build documentation
        run: |
          doxygen

      - name: Assemble pages
        run: |
          mkdir -p build/pages/bench
          cp -r doc/html/. build/pages/
          cp -r doc/site/. build/pages/bench/

      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v3
        with:
          deploy_key: ${{ secrets.ACTIONS_DEPLOY_KEY }}
          publish_dir: build/pages
